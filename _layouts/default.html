<!DOCTYPE html>
<html lang="{{ site.locale | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% capture doc_title %}{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} @ MIT{% endif %}{% endcapture %}
  {% assign doc_desc = page.description | default: site.description %}
  <title>{{ doc_title }}</title>
  <meta name="description" content="{{ doc_desc }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph / link unfurl -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ doc_title }}">
  <meta property="og:description" content="{{ doc_desc }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@davyneuro">
  <meta name="twitter:creator" content="@davyneuro">
{% if page.layout == 'home' %}
  <!-- Person / ProfilePage structured data (homepage only) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "mainEntity": {
      "@type": "Person",
      "name": {{ site.author.name | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "image": {{ site.author.avatar | absolute_url | jsonify }},
      "jobTitle": "Ph.D. Candidate",
      "description": {{ doc_desc | jsonify }},
      "affiliation": [
        { "@type": "Organization", "name": "Harvard\u2013MIT Health Sciences and Technology", "url": "https://hst.mit.edu/" },
        { "@type": "Organization", "name": "Massachusetts Institute of Technology", "url": "https://www.mit.edu/" }
      ],
      "sameAs": [
        {{ site.author.googlescholar | jsonify }},
        {{ site.author.linkedin | prepend: 'https://www.linkedin.com/in/' | jsonify }},
        {{ site.author.substack | jsonify }},
        {{ site.author.medium | jsonify }},
        {{ site.author.twitter | jsonify }}
      ]
    }
  }
  </script>
{% endif %}
  <meta name="twitter:title" content="{{ doc_title }}">
  <meta name="twitter:description" content="{{ doc_desc }}">

  <!-- favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="layout-{{ page.layout }}">
  {{ content }}
</body>
</html>
