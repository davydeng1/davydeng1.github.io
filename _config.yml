# ============================================================
#  Davy Deng — personal academic site
#  Minimal Jekyll config (GitHub Pages native build).
# ============================================================

title            : "Davy Deng"
tagline          : "Emulating the brain, starting with C. elegans"
description       : "Davy Deng — Ph.D. candidate at Harvard–MIT HST developing technologies toward whole brain emulation, starting with C. elegans."
url              : "https://davydeng1.github.io"
baseurl          : ""
locale           : "en-US"

author:
  name           : "Davy Deng"
  pronouns       : "He / Him"
  avatar         : "/images/Image.jpeg"
  location       : "Boston / Cambridge, MA"
  email          : "davy@mit.edu"
  googlescholar  : "https://scholar.google.com/citations?hl=en&user=GuGeMn0AAAAJ"
  linkedin       : "davy-deng-280638194/"

# ---- Collections -------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# ---- Build -------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - design_handoff_academic_redesign
  - vendor
  - .github

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
